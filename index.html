<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi modelo en AR</title>
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
  body { margin: 0; overflow: hidden; }
  #ayuda {
    position: fixed; top: 8px; left: 8px; right: 8px; z-index: 10;
    background: rgba(0,0,0,.6); color: #fff; font: 14px sans-serif;
    padding: 8px 12px; border-radius: 8px; text-align: center;
  }
</style>
<script>
  // Ajusta el modelo para que mida 1 unidad (el ancho del marcador),
  // lo centra y lo apoya sobre el marcador.
  AFRAME.registerComponent('autofit', {
    schema: { size: { type: 'number', default: 1 } },
    init: function () {
      var el = this.el, size = this.data.size;
      el.addEventListener('model-loaded', function () {
        var obj = el.getObject3D('mesh');
        if (!obj) return;
        obj.position.set(0, 0, 0);
        obj.scale.set(1, 1, 1);
        obj.updateMatrixWorld(true);
        var box = new THREE.Box3().setFromObject(obj);
        var dim = box.getSize(new THREE.Vector3());
        var c = box.getCenter(new THREE.Vector3());
        var s = size / Math.max(dim.x, dim.y, dim.z);
        obj.scale.setScalar(s);
        obj.position.set(-c.x * s, -box.min.y * s, -c.z * s);
        document.getElementById('ayuda').textContent = 'Modelo cargado. Apunta al marcador Hiro';
      });
      el.addEventListener('model-error', function () {
        document.getElementById('ayuda').textContent = 'No se encontró modelo.glb';
      });
    }
  });
</script>
</head>
<body>
<div id="ayuda">Cargando modelo...</div>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;"
         vr-mode-ui="enabled: false">
  <a-marker preset="hiro">
    <a-light type="ambient" color="#FFFFFF" intensity="2"></a-light>
<a-light type="directional" color="#FFFFFF" intensity="2" position="1 2 1"></a-light>
    <!-- Si el modelo sale tumbado, cambia rotation a "-90 0 0" -->
    <a-entity gltf-model="modelo.glb" autofit="size: 1" rotation="0 0 0"></a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>
<script>
  window.addEventListener('load', function () {
    var a = document.getElementById('ayuda');
    if (typeof AFRAME === 'undefined') {
      a.textContent = 'No cargó A-Frame (revisa tu conexión)';
    } else if (!AFRAME.components.arjs && !AFRAME.systems.arjs) {
      a.textContent = 'No cargó AR.js (revisa tu conexión)';
    }
  });
</script>
</body>
</html>
